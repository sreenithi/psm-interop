--flagfile=config/common-multinet-mesh.cfg

# Region for pre-provisioned HTTP Connect PSC and SWP resources
--http_connect_region=us-east7

# Client GKE cluster context hosting client pods
--kube_context=gke_grpc-testing_us-east7-a_psm-interop-multinet-client

# Server GKE cluster context hosting server pods
--secondary_kube_context=gke_grpc-testing_us-east7-a_psm-interop-multinet-server

# The Kokoro test driver VM (grpc-ubuntu22, default-vpc) has no route to pod IPs
# in psm-connect-client-vpc / psm-connect-server-vpc. Reach test app pods via
# kubectl port-forward through the GKE control plane instead.
--debug_use_port_forwarding
